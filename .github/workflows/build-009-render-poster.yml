name: Create 009 render hero poster
on:
  push:
    paths:
      - .github/workflows/build-009-render-poster.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Generate JPG fallback from approved animation
        run: |
          ffmpeg -y -hide_banner -loglevel error -ss 2 -i assets/009_render_header_desktop_light.mp4 -frames:v 1 -vf scale=960:540 -q:v 3 assets/009_render_header_poster.jpg
          test -s assets/009_render_header_poster.jpg
      - name: Commit fallback poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/009_render_header_poster.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized 009 render hero poster"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
