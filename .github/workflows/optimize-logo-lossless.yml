name: Validate lossless 009fly animated logo optimization
on:
  push:
    paths:
      - .github/workflows/optimize-logo-lossless.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install animation conversion library
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Convert and verify every frame, timing and transparency
        run: python scripts/optimize_logo_lossless.py
      - name: Commit only verified, smaller animated WebP
        run: |
          if test -s 009fly-nav-logo-lossless.webp; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 009fly-nav-logo-lossless.webp
            if ! git diff --cached --quiet; then
              git commit -m "Add pixel-identical lossless animated navigation logo"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          else
            echo "Original GIF remains in use: no smaller exact candidate."
          fi
