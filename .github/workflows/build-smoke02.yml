name: Render 009fly approved smoke 02
on:
  push:
    paths:
      - scripts/build_smoke02.py
      - .github/workflows/build-smoke02.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg
      - name: Render optimized loops from approved stock footage
        run: python scripts/build_smoke02.py
      - name: Commit generated smoke background assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/009fly-smoke02-desktop-1080p.mp4 assets/009fly-smoke02-mobile-720p.mp4 assets/009fly-smoke02-poster.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add approved smoke 02 optimized desktop and mobile assets"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
