name: Optimize seamless desktop hero
on:
  push:
    paths:
      - scripts/optimize_hero_loop.py
      - .github/workflows/optimize-hero-loop.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone FFmpeg
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg
      - name: Build both seamless 720p60 and 720p30 MP4 files
        run: python scripts/optimize_hero_loop.py
      - name: Commit optimized video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/009fly-hero-ink-seamless-720p60.mp4 assets/009fly-hero-ink-seamless-720p30.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add optimized seamless smoke loop for desktop"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
