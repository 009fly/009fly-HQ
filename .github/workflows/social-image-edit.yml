name: Prepare HQ social preview adjustment
on:
  push:
    branches:
      - preview/social-preview-footer
    paths:
      - .github/workflows/social-image-edit.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Remove left footer and rule, preserve right website
        run: |
          python - <<'PY'
          from PIL import Image,ImageDraw
          img=Image.open('009fly-social-preview.jpg').convert('RGB')
          assert img.size==(1200,630),img.size
          ImageDraw.Draw(img).rectangle((0,542,992,629),fill=(0,0,0))
          img.save('009fly-social-preview.jpg','JPEG',quality=95,subsampling=0,optimize=True)
          PY
      - name: Commit image to preview branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 009fly-social-preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Remove HQ social preview footer strip"
            git push
          fi
